<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Տիեզերագնացի Ակադեմիա</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #0b0b1a;
        }
        /* UI Ցուցիչներ */
        .ui-panel {
            position: absolute;
            top: 15px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #hearts-panel { left: 15px; color: #ff4d4d; }
        #stars-panel { right: 15px; color: #ffd700; }

        /* Կառավարման Կոճակներ */
        .touch-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            z-index: 10;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.6);
        }

        /* Ձախ կողմում՝ Ձախ ու Աջ */
        #btn-left { bottom: 15px; left: 15px; width: 60px; height: 60px; }
        #btn-right { bottom: 15px; left: 85px; width: 60px; height: 60px; }

        /* Աջ կողմում՝ Թռչել ու Կրակել */
        #btn-up { bottom: 15px; right: 85px; width: 60px; height: 60px; }
        #btn-fire { bottom: 10px; right: 15px; width: 65px; height: 65px; background: rgba(255, 77, 77, 0.35); border-color: #ff4d4d; }

        /* Էկրաններ */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .overlay h1 { font-size: 32px; margin-bottom: 10px; }
        .overlay button {
            padding: 10px 24px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hearts-panel" class="ui-panel">❤️❤️❤️</div>
    <div id="stars-panel" class="ui-panel">⭐ 0 / 15</div>

    <div id="btn-left" class="touch-btn">◄</div>
    <div id="btn-right" class="touch-btn">►</div>
    <div id="btn-up" class="touch-btn">▲</div>
    <div id="btn-fire" class="touch-btn">🍎</div>

    <div id="win-screen" class="overlay hidden">
        <h1 style="color: #4CAF50;">ՀԱՂԹԱՆԱԿ: 🎉</h1>
        <p>Դու հավաքեցիր բոլոր 15 աստղերը։</p>
        <button onclick="resetGame()">Խաղալ Կրկին</button>
    </div>
    <div id="lose-screen" class="overlay hidden">
        <h1 style="color: #ff4d4d;">ՊԱՐՏՈՒԹՅՈՒՆ 💔</h1>
        <p>Այլմոլորակայինները հաղթեցին...</p>
        <button onclick="resetGame()">Փորձել Կրկին</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let lives = 3;
let score = 0;
let gameOver = false;

const keys = { left: false, right: false, up: false, fire: false };

let bgStars = [];
let planets = [];
let platforms = [];

function initWorld() {
    const w = canvas.width;
    const h = canvas.height;

    bgStars = Array.from({ length: 50 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 2 + 1
    }));

    planets = [
        { x: w * 0.15, y: h * 0.2, r: 25, color: "#e67e22" },
        { x: w * 0.85, y: h * 0.25, r: 35, color: "#2980b9" }
    ];

    platforms = [
        { x: 0, y: h * 0.85, w: w * 0.25, h: 15 },
        { x: w * 0.3, y: h * 0.72, w: w * 0.18, h: 15 },
        { x: w * 0.52, y: h * 0.6, w: w * 0.2, h: 15 },
        { x: w * 0.22, y: h * 0.45, w: w * 0.16, h: 15 },
        { x: w * 0.42, y: h * 0.32, w: w * 0.18, h: 15 },
        { x: w * 0.72, y: h * 0.48, w: w * 0.2, h: 15 },
        { x: w * 0.65, y: h * 0.78, w: w * 0.28, h: 15 }
    ];
}

const player = {
    x: 40,
    y: 100,
    width: 24,
    height: 34,
    dx: 0,
    dy: 0,
    speed: 4,
    jumpForce: -11,
    grounded: false,
    facing: "right"
};

let stars = [];
function spawnStars() {
    stars = [];
    platforms.forEach((p, index) => {
        stars.push({ x: p.x + p.w * 0.3, y: p.y - 25, collected: false });
        stars.push({ x: p.x + p.w * 0.7, y: p.y - 25, collected: false });
    });
    if (stars.length < 15) {
        stars.push({ x: canvas.width * 0.5, y: canvas.height * 0.2, collected: false });
    }
    stars = stars.slice(0, 15);
}

let aliens = [];
function spawnAliens() {
    aliens = [];
    if (platforms.length >= 4) {
        let p1 = platforms[1];
        aliens.push({ x: p1.x + 10, y: p1.y - 22, w: 22, h: 22, minX: p1.x, maxX: p1.x + p1.w - 22, speed: 1.2 });
        
        let p2 = platforms[2];
        aliens.push({ x: p2.x + 10, y: p2.y - 22, w: 22, h: 22, minX: p2.x, maxX: p2.x + p2.w - 22, speed: 1.5 });

        let p6 = platforms[6];
        aliens.push({ x: p6.x + 10, y: p6.y - 22, w: 22, h: 22, minX: p6.x, maxX: p6.x + p6.w - 22, speed: 1.3 });
    }
}

let apples = [];

function setupControls() {
    window.addEventListener("keydown", e => {
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
        if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.up = true;
        if (e.code === "KeyF" || e.code === "KeyK") shootApple();
    });
    window.addEventListener("keyup", e => {
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
        if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.up = false;
    });

    const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyName] = true; });
        btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; });
    };
    bindTouch("btn-left", "left");
    bindTouch("btn-right", "right");
    bindTouch("btn-up", "up");

    document.getElementById("btn-fire").addEventListener("touchstart", (e) => {
        e.preventDefault();
        shootApple();
    });
}

function shootApple() {
    if (gameOver) return;
    apples.push({
        x: player.x + player.width / 2,
        y: player.y + player.height / 2,
        dx: player.facing === "right" ? 7 : -7,
        r: 6
    });
}

function resetPlayer() {
    player.x = 20;
    player.y = platforms[0] ? platforms[0].y - player.height - 10 : 100;
    player.dx = 0;
    player.dy = 0;
}

function takeDamage() {
    lives--;
    updateUI();
    if (lives <= 0) {
        gameOver = true;
        document.getElementById("lose-screen").classList.remove("hidden");
    } else {
        resetPlayer();
    }
}

function updateUI() {
    document.getElementById("hearts-panel").innerHTML = "❤️".repeat(Math.max(0, lives));
    document.getElementById("stars-panel").innerHTML = `⭐ ${score} / 15`;
}

function resetGame() {
    lives = 3;
    score = 0;
    gameOver = false;
    initWorld();
    resetPlayer();
    spawnStars();
    spawnAliens();
    apples = [];
    updateUI();
    document.getElementById("win-screen").classList.add("hidden");
    document.getElementById("lose-screen").classList.add("hidden");
}

function update() {
    if (gameOver) return;

    if (keys.left) { player.dx = -player.speed; player.facing = "left"; }
    else if (keys.right) { player.dx = player.speed; player.facing = "right"; }
    else { player.dx = 0; }

    if (keys.up && player.grounded) {
        player.dy = player.jumpForce;
        player.grounded = false;
    }

    player.dy += 0.48;
    player.x += player.dx;
    player.y += player.dy;

    player.grounded = false;
    platforms.forEach(p => {
        if (player.x < p.x + p.w &&
            player.x + player.width > p.x &&
            player.y + player.height >= p.y &&
            player.y + player.height <= p.y + p.h + 10 &&
            player.dy >= 0) {
            player.grounded = true;
            player.dy = 0;
            player.y = p.y - player.height;
        }
    });

    if (player.y > canvas.height + 60) {
        takeDamage();
    }

    for (let i = apples.length - 1; i >= 0; i--) {
        let app = apples[i];
        app.x += app.dx;

        if (app.x < 0 || app.x > canvas.width) {
            apples.splice(i, 1);
            continue;
        }

        for (let j = aliens.length - 1; j >= 0; j--) {
            let al = aliens[j];
            if (app.x > al.x && app.x < al.x + al.w && app.y > al.y && app.y < al.y + al.h) {
                aliens.splice(j, 1);
                apples.splice(i, 1);
                break;
            }
        }
    }

    aliens.forEach(al => {
        al.x += al.speed;
        if (al.x < al.minX || al.x + al.w > al.maxX) al.speed *= -1;

        if (player.x < al.x + al.w &&
            player.x + player.width > al.x &&
            player.y < al.y + al.h &&
            player.y + player.height > al.y) {
            takeDamage();
        }
    });

    stars.forEach(s => {
        if (!s.collected &&
            player.x < s.x + 18 &&
            player.x + player.width > s.x - 18 &&
            player.y < s.y + 18 &&
            player.y + player.height > s.y - 18) {
            s.collected = true;
            score++;
            updateUI();
            if (score >= 15) {
                gameOver = true;
                document.getElementById("win-screen").classList.remove("hidden");
            }
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffffff";
    bgStars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

    planets.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = "#4a4e69";
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "#9a8c98";
        ctx.fillRect(p.x, p.y, p.w, 4);
        ctx.fillStyle = "#4a4e69";
    });

    stars.forEach(s => {
        if (!s.collected) {
            ctx.fillStyle = "#ffd700";
            ctx.font = "16px Arial";
            ctx.fillText("⭐", s.x - 8, s.y + 6);
        }
    });

    ctx.fillStyle = "#2ecc71";
    aliens.forEach(al => {
        ctx.fillRect(al.x, al.y, al.w, al.h);
        ctx.fillStyle = "#000";
        ctx.fillRect(al.x + 3, al.y + 4, 4, 4);
        ctx.fillRect(al.x + 14, al.y + 4, 4, 4);
        ctx.fillStyle = "#2ecc71";
    });

    apples.forEach(app => {
        ctx.fillStyle = "#ff4d4d";
        ctx.beginPath();
        ctx.arc(app.x, app.y, app.r, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    ctx.fillStyle = "#3498db";
    if (player.facing === "right") {
        ctx.fillRect(player.x + 12, player.y + 4, 9, 9);
    } else {
        ctx.fillRect(player.x + 3, player.y + 4, 9, 9);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initWorld();
spawnStars();
spawnAliens();
resetPlayer();
setupControls();
gameLoop();
</script>

</body>
</html>
